Fluxos e Regras de Negócio
Autenticação e Autorização
Registro de Usuário:
Dados necessários: nome, email, senha
As senhas são hash antes de armazenamento
Usuários são armazenados no Firebase Realtime Database
Usuários novos são do tipo "regular" por padrão
Apenas usuários "admin" são gerados manualmente ou via API privada
Login:
Usuário fornece email e senha
API verifica credenciais contra banco de dados Firebase
Se válido, gera token JWT com payload: { userId, name, type, iat, exp }
Token é válido por 24 horas
Frontend armazena token no localStorage para sessões
Middleware de Proteção:
Intercepta todas as requisições para rotas protegidas (/api/otp/*, /dashboard/*)
Verifica existência e validade do token JWT no header Authorization: Bearer <token>
Não verifica contra o banco, apenas a assinatura e expiração do token
Rejeita requisições com tokens ausentes ou inválidos (401)
Se válido, adiciona x-user-id ao header para uso nas APIs
Verificação de Permissões:
Todas as rotas de API OTP verificam se o usuário existe no banco e se é admin
Acesso ao dashboard é permitido, mas conteúdo é condicionado ao tipo de usuário
Usuários não-admin veem mensagem de "Acesso Negado" no dashboard
Usuários admin veem o gerenciador completo de OTP
Gerenciamento de OTP
Listagem de OTPs:
Apenas usuários admin podem listar OTPs
API retorna apenas OTPs pertencentes ao usuário logado
Frontend permite filtrar por emissor (issuer) e nome
Adição de OTP:
Usuários podem adicionar via upload de imagem QR code
Usuários podem usar câmera para escanear QR codes
Backend valida URI no formato otpauth://totp/... e extrai parâmetros
OTPs são salvos associados ao usuário logado
Geração de Códigos:
Frontend gera códigos TOTP em tempo real usando biblioteca TOTP
Códigos são de 6 dígitos por padrão, mudando a cada 30 segundos
Uma barra de progresso mostra quanto tempo resta para o código atual
Algoritmo default é SHA1, conforme RFC 6238
Gestão de OTP:
Usuários podem editar nome/descrição dos OTPs
Usuários podem excluir OTPs individualmente
Suporte para exclusão em lote de múltiplos OTPs
Opção para copiar código atual para clipboard
Prevenção de Bugs e Otimizações
Debounce de Requisições:
Store.js implementa debounce para evitar chamadas múltiplas à API
Variável lastFetchTime mantém controle da última chamada
Requisições repetidas em menos de 2 segundos são ignoradas
URL Consistentes:
trailingSlash: false no Next.js para evitar redirecionamentos
Todas as URLs de API terminam com barra: /api/otp/ ao invés de /api/otp
Isso evita o problema de redirecionamentos 308 e ERR_TOO_MANY_REDIRECTS
Tratamento de Erros:
Todas as operações assíncronas estão em blocos try/catch
Timeout para operações Firebase para evitar requisições pendentes
Frontend mostra mensagens de erro user-friendly
Sistema de retry com backoff exponencial para falhas temporárias
Proteção contra Loops:
UseEffect tem dependências controladas para evitar loops infinitos
Flag loadAttempted no dashboard para garantir apenas uma carga inicial
Sistema de estado centralizado para evitar props drilling
Considerações Importantes
Ambiente de Desenvolvimento:
Aplicação detecta NODE_ENV para ajustar comportamento
Em desenvolvimento, erros são mais verbosos e incluem stack traces
Variáveis de ambiente locais devem ser configuradas em .env.local
Segurança:
Secrets TOTP são armazenados em texto simples no banco (requisito para geração)
Toda comunicação deve ser via HTTPS em produção
Tokens JWT são assinados com um segredo forte e expirável
Autenticação de dois fatores não implementada para o próprio sistema (ironia)
Performance:
Geração de códigos TOTP ocorre no cliente para reduzir carga no servidor
Estado global via Zustand para minimizar re-renders
Componentes otimizados com memoização quando necessário
API Routes server-side para operações sensíveis
Requisitos:
Sistema é projetado para administradores de TI gerenciarem múltiplos OTPs
Não substitui aplicativos como Google Authenticator para uso final
Foco em segurança, facilidade de uso e confiabilidade
Este sistema completo oferece uma solução robusta para gerenciamento de tokens TOTP, com foco em segurança e usabilidade para administradores